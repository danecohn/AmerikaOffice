name: Verify AltStack ecosystem release
on:
  push:
    branches: [altstack/ecosystem-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build production image
        run: docker build -t altoffice-portal .
