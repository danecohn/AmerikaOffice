name: Verify Office features and editor overlay
on:
  push:
    branches: [altstack/ecosystem-20261024, altstack/euro-office-editor]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: oven/bun:1.4.3
    steps:
      - uses: actions/checkout@v6
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bun editor/test-interface.mjs
